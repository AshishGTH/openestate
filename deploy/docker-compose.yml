name: openestate

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    <<: *restart-policy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openestate}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_SYSTEM_PASSWORD: ${POSTGRES_SYSTEM_PASSWORD:?POSTGRES_SYSTEM_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openestate} -d ${POSTGRES_DB:-openestate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    <<: *restart-policy
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    <<: *restart-policy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://openestate_app:${POSTGRES_APP_PASSWORD:-openestate}@postgres:5432/${POSTGRES_DB:-openestate}
      DATABASE_URL_SYSTEM: postgresql://openestate_system:${POSTGRES_SYSTEM_PASSWORD}@postgres:5432/${POSTGRES_DB:-openestate}
      REDIS_URL: redis://redis:6379
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-http://localhost:8080}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      PAN_ENCRYPTION_KEY: ${PAN_ENCRYPTION_KEY:?PAN_ENCRYPTION_KEY is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      PLUGIN_SECRET_ENCRYPTION_KEYS: ${PLUGIN_SECRET_ENCRYPTION_KEYS:?PLUGIN_SECRET_ENCRYPTION_KEYS is required}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    <<: *restart-policy
    depends_on:
      - api

  portal:
    build:
      context: ..
      dockerfile: deploy/docker/portal.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    <<: *restart-policy
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    <<: *restart-policy
    depends_on:
      - api
      - web
      - portal
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    <<: *restart-policy
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openestate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
  minio_data:
