# OpenEstate staging: TLS-only nginx site for the API + web + portal.
# Copy to /etc/nginx/sites-available/openestate-staging, replace the three
# placeholders, then:  sudo nginx -t && sudo systemctl reload nginx
#
#   __SERVER_NAME__   staging DNS name, e.g. staging.example.com
#   __CERT_DIR__      directory holding fullchain.pem and privkey.pem
#                     (certbot: /etc/letsencrypt/live/<name>)
#   /opt/openestate/current   the release symlink install/upgrade-native.sh maintains
#
# Why these choices (they matter for the mobile app's refresh-cookie design):
#  * The API sets the refresh and CSRF cookies with Secure decided from
#    req.secure, which Express derives from X-Forwarded-Proto (trust proxy = 1).
#    So this server MUST send X-Forwarded-Proto https, or the cookies go out
#    without Secure. Do not add proxy_cookie_* rules and do not strip Set-Cookie:
#    the mobile app reads the Set-Cookie header itself and sends Cookie and
#    X-CSRF-Token back by hand.
#  * nginx must forward the Cookie and X-CSRF-Token request headers untouched
#    (it does by default; do not add proxy_set_header Cookie "").
#  * Refresh cookie: HttpOnly, SameSite=Strict, Path=/api/v1/auth. Nothing here
#    may change the /api/ path prefix, hence proxy_pass keeps /api/ on both sides.
#  * Rate limiting is done by the API (Redis-backed throttler keyed on the
#    client address). It sees the real client through X-Forwarded-For; do not put
#    a second, per-IP limit here that would treat all mobile users behind one
#    carrier NAT as one client.
#  * The largest upload the API accepts is 10 MB (multer fileSize in the
#    inquiry/inventory/media controllers; 5 MB for construction updates). 11m
#    covers 10 MB plus multipart framing. JSON bodies are far smaller.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    # Let's Encrypt HTTP-01 challenges, if certbot --webroot is used:
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `http2` on the listen line works on every nginx version (Ubuntu 22.04 ships 1.18, 24.04 ships 1.24). The
    # separate `http2 on;` directive needs nginx 1.25.1+ and is a syntax error on those; on 1.25.1+ the parameter
    # below only prints a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Only send after you have confirmed HTTPS works for every name on this host.
    # For a first staging pass use max-age=300, then raise it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 11m;
    client_body_timeout 30s;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # Longer than any client deadline in the mobile app (20-30 s), so nginx
        # never cuts off a request the app is still willing to wait for.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Responses carry tokens and personal data.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Portal SPA (built with base /portal/): alias, not root.
    location /portal/ {
        alias /opt/openestate/current/portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    # Staff web app.
    location / {
        root /opt/openestate/current/web;
        try_files $uri $uri/ /index.html;
    }
}
