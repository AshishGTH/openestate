name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly full-strength property-test run (see integration-tests job).
    - cron: "0 3 * * *"
  # Manual trigger, treated identically to `schedule` throughout this file
  # (see integration-tests' PROPERTY_NUM_RUNS/timeout-minutes) — the only
  # way to actually exercise and verify the nightly-strength path on demand
  # rather than waiting for the next 03:00 UTC firing.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "20"

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    # No job here had an upper time bound, so GitHub's 6-hour default
    # applied: a hung step burned runner time for hours and never
    # self-reported. Found when a migration blocked on a database lock and
    # native-upgrade sat in_progress for an hour against a ~3 minute norm.
    # 30 is far above every job's real duration (longest observed ~8 min)
    # and far below the point where a hang stops being obvious.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Bitten twice by the same bug: deploy/native/*.sh (Phase 8) and
      # scripts/test-setup.sh (this session) were both committed as mode
      # 644 from a Windows checkout, invisible locally (core.filemode is
      # false there), and only failed with exit 126 the moment a real
      # Linux runner tried `./the-script.sh`. Checked before any
      # dependency install so a broken mode fails in seconds, not after
      # a multi-minute pnpm install. deploy/native/lib.sh is the one
      # deliberate exception - it's only ever `source`d (see its own
      # header comment), never invoked directly, so it needs no execute
      # bit and stays 644.
      - name: Verify every tracked .sh script is executable
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" = "100755" ]; then
              continue
            fi
            if [ "$f" = "deploy/native/lib.sh" ]; then
              continue
            fi
            echo "::error file=$f::$f is tracked as mode $mode, not 100755 - a script invoked directly (./$f) fails with 'Permission denied' on a real Linux runner even though it can look executable on a Windows checkout. Fix: git update-index --chmod=+x $f"
            fail=1
          done
          exit $fail

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openestate/db generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (no DB)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  integration-tests:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    # No job here had an upper time bound, so GitHub's 6-hour default
    # applied: a hung step burned runner time for hours and never
    # self-reported. Found when a migration blocked on a database lock and
    # native-upgrade sat in_progress for an hour against a ~3 minute norm.
    # 30 is far above every job's real duration on push/PR (longest observed
    # ~8 min) and far below the point where a hang stops being obvious. The
    # nightly schedule run gets more: it runs the ledger property test at
    # full strength (2000 iterations, see PROPERTY_NUM_RUNS below), which
    # alone was observed taking 28+ minutes and hitting this ceiling before
    # even completing — three consecutive nightly runs cancelled this way,
    # unnoticed because nothing blocks on a scheduled run. Paired with the
    # "Fail if any test was skipped" fix below (which used to silently
    # re-run the entire 2000-iteration property test a SECOND time, back
    # to back — the actual bigger driver of the overrun). 90 is real
    # headroom on top of that fix, verified by an actual green
    # workflow_dispatch run at this exact PROPERTY_NUM_RUNS=2000 path — see
    # CLAUDE.md's reporting-suite entry / docs/todo.md for the run that
    # proved it and its real duration, not assumed from this comment alone.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 30 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openestate_super
          POSTGRES_PASSWORD: test_super_pass
          POSTGRES_DB: openestate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openestate_super -d openestate_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openestate/db generate

      # Two independent things in this job need compiled output that
      # `pnpm install` alone doesn't produce:
      #   1. packages/db/prisma/seed.ts imports from @openestate/shared,
      #      resolved via plain Node `require()` (tsx runs it, not Vite) —
      #      the same gap the NestJS production runtime has, needing
      #      packages/shared built first (Phase 1 decisions: "Vite builds
      #      don't require pnpm --filter @openestate/shared build first,
      #      but NestJS production runtime does"). The "Run seed" step
      #      below invokes pnpm --filter directly, bypassing turbo's
      #      dependsOn: ["^build"] graph.
      #   2. Several e2e test files (e2e-portal, e2e-portal-throttle,
      #      e2e-broker-portal, e2e-webhooks-leads, e2e-plugins) deliberately
      #      boot from apps/api's COMPILED dist/app.module, not TS source
      #      (Phase 6 decisions: esbuild's transform doesn't emit correct
      #      design:paramtypes decorator metadata for NestJS DI). turbo's
      #      `test` task only depends on `^build` (upstream packages), never
      #      the same package's own `build` — so `pnpm test` alone never
      #      builds apps/api itself. The OTHER job in this workflow
      #      ("Lint, typecheck, unit tests, build") does run `pnpm build`,
      #      but GitHub Actions jobs are separate runners with no shared
      #      filesystem, so that build is invisible here.
      # A full `pnpm build` (not just @openestate/shared) covers both,
      # building every workspace package in dependency order via turbo.
      - name: Build workspace
        run: pnpm build

      # Delegates role creation, migrate, and seed to the exact same script
      # a contributor runs locally (scripts/test-setup.sh) instead of a
      # second, hand-maintained copy of the same SQL — the two had already
      # drifted once (this job never regenerated the Prisma client or built
      # packages/shared the way the script now does) before CI started
      # actually exercising the contributor path. TEST_PG_ADMIN_USER points
      # it at the service container's own superuser (POSTGRES_USER above)
      # instead of the local-install default 'postgres'; PGPASSWORD forces
      # the script's TCP mode (there's no shared OS user to `sudo -u
      # postgres` as inside a container) — the password matches
      # POSTGRES_PASSWORD above by the same hardcoded-test-credential
      # convention setup-database.sh's own header documents. The
      # 'openestate' shared-cluster guard never fires here: a fresh service
      # container only ever has openestate_test plus Postgres's own
      # always-present template/postgres databases.
      #
      # .test-env's values are appended to $GITHUB_ENV so every later step
      # inherits DATABASE_URL_TEST/DATABASE_URL_TEST_SYSTEM/REDIS_TEST_URL
      # from the script's own output — the two steps below no longer carry
      # a second hardcoded copy that could quietly drift from what the
      # script actually provisions.
      - name: Provision test database (scripts/test-setup.sh)
        env:
          TEST_PG_HOST: localhost
          TEST_PG_ADMIN_USER: openestate_super
          PGPASSWORD: test_super_pass
        run: |
          ./scripts/test-setup.sh
          grep '^export ' .test-env | sed -E 's/^export //; s/"//g' >> "$GITHUB_ENV"

      - name: Run integration tests
        env:
          # Ledger property test: full CI floor (2000 runs) only on the
          # nightly schedule (or a manual workflow_dispatch run standing in
          # for one); PR/push runs 500 for fast feedback. Both are >= the
          # property test's own local-dev default, so PR runs still
          # exercise the invariant meaningfully, just not exhaustively.
          # See CLAUDE.md Phase 4 decisions.
          PROPERTY_NUM_RUNS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2000' || '500' }}
        run: pnpm test

      - name: Fail if any test was skipped
        env:
          # Deliberately NOT the same value as the step above, and
          # deliberately NOT conditioned on event_name at all — this step's
          # only job is detecting skipped tests (numPendingTests), which
          # doesn't depend on how many fast-check iterations a passing
          # property test ran. It used to inherit the same
          # PROPERTY_NUM_RUNS as "Run integration tests", which meant the
          # nightly schedule silently ran the 2000-iteration ledger
          # property test a SECOND time, back to back, just to check a
          # skip count — the real driver of three consecutive nightly runs
          # blowing the job's 30-minute timeout before this was found
          # (the property test alone took 28+ minutes and was still
          # running when cancelled). A tiny fixed value still proves the
          # test isn't skipped; it proves nothing about the invariant
          # holding at scale, which the step above already proved once.
          PROPERTY_NUM_RUNS: 5
          PROPERTY_NUM_RUNS_COMMISSION: 5
        run: |
          # Run tests with JSON reporter and check for skipped tests
          cd packages/db
          npx vitest run --reporter=json 2>/dev/null | tee /tmp/db-results.json || true
          SKIPPED=$(node -e "const r=require('/tmp/db-results.json'); console.log(r.numPendingTests || 0)" 2>/dev/null || echo "0")
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::$SKIPPED integration tests were skipped in packages/db — a skipped security test must never look green"
            exit 1
          fi
          cd ../../apps/api
          npx vitest run --reporter=json 2>/dev/null | tee /tmp/api-results.json || true
          SKIPPED=$(node -e "const r=require('/tmp/api-results.json'); console.log(r.numPendingTests || 0)" 2>/dev/null || echo "0")
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::$SKIPPED integration tests were skipped in apps/api — a skipped security test must never look green"
            exit 1
          fi
          echo "All integration tests ran — zero skipped."

  e2e-playwright:
    name: E2E (Playwright against a real browser + built frontend)
    runs-on: ubuntu-latest
    # No job here had an upper time bound, so GitHub's 6-hour default
    # applied: a hung step burned runner time for hours and never
    # self-reported. Found when a migration blocked on a database lock and
    # native-upgrade sat in_progress for an hour against a ~3 minute norm.
    # 30 is far above every job's real duration (longest observed ~8 min)
    # and far below the point where a hang stops being obvious.
    timeout-minutes: 30
    needs: lint-typecheck-build
    # Standard Postgres/Redis ports, matching the integration-tests job
    # above and apps/e2e/playwright.config.ts's own fallbacks — so the
    # same connection strings work here and on a developer's machine
    # after `scripts/test-setup.sh`, with no CI-only override needed.
    # (These are GitHub Actions service containers — runner
    # infrastructure. Nothing in this repo builds or ships an image; see
    # CLAUDE.md rule #1.)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openestate_super
          POSTGRES_PASSWORD: test_super_pass
          POSTGRES_DB: openestate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openestate_super -d openestate_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openestate/db generate

      - name: Install Playwright's Chromium
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      # Same reason as the "Build workspace" step in integration-tests
      # above: apps/api needs to run compiled (correct DI metadata), and
      # apps/e2e's own CJS imports of @openestate/db/@openestate/shared
      # resolve to their built dist output, not raw TS source (see
      # apps/e2e/package.json's deliberate lack of "type": "module" and
      # fixtures/seed.ts's comment on why).
      - name: Build workspace
        run: pnpm build

      # Role names are openestate_test_app/openestate_test_system, NOT a
      # real install's openestate_app/openestate_system — this job's own
      # ephemeral service-container Postgres never shares a cluster with a
      # real install anyway, but scripts/test-setup.sh and this inline copy
      # are meant to stay in sync in what they create, and the whole point
      # of the rename (see CHANGELOG's [Unreleased] Security entry) is that
      # test provisioning never uses the same names a real install does,
      # anywhere.
      - name: Create application roles
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: openestate_super
          PGPASSWORD: test_super_pass
          PGDATABASE: openestate_test
        run: |
          psql <<'EOSQL'
            CREATE ROLE openestate_test_app WITH LOGIN PASSWORD 'test_app_pass' NOINHERIT;
            CREATE ROLE openestate_test_system WITH LOGIN PASSWORD 'test_system_pass' NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
            GRANT USAGE ON SCHEMA public TO openestate_test_app;
            GRANT USAGE ON SCHEMA public TO openestate_test_system;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO openestate_test_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO openestate_test_system;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO openestate_test_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO openestate_test_system;
          EOSQL

      - name: Apply migration
        env:
          DATABASE_URL: postgresql://openestate_super:test_super_pass@localhost:5432/openestate_test
        run: |
          cd packages/db
          npx prisma migrate deploy
          npx prisma migrate status

      # The portal RLS helper functions (portal_applicant/portal_broker/
      # portal_can_access_booking/booking_has_co_applicant) are granted
      # EXECUTE by the phase6_portal migration to the literal
      # 'openestate_app'/'openestate_system' names only — see
      # deploy/native/setup-database.sh's own identical comment. Table
      # grants alone would leave openestate_test_app/openestate_test_system
      # unable to call them, breaking every portal RLS policy that does —
      # exactly the kind of thing this job's own portal specs exercise.
      # Unconditional here (unlike setup-database.sh's existence-checked
      # version): this step always runs after "Apply migration" in this
      # job's fixed order, so the functions always already exist.
      - name: Grant table-level permissions
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: openestate_super
          PGPASSWORD: test_super_pass
          PGDATABASE: openestate_test
        run: |
          psql <<'EOSQL'
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO openestate_test_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO openestate_test_system;
            GRANT EXECUTE ON FUNCTION portal_applicant() TO openestate_test_app, openestate_test_system;
            GRANT EXECUTE ON FUNCTION portal_broker() TO openestate_test_app, openestate_test_system;
            GRANT EXECUTE ON FUNCTION portal_can_access_booking(uuid) TO openestate_test_app, openestate_test_system;
            GRANT EXECUTE ON FUNCTION booking_has_co_applicant(uuid, uuid) TO openestate_test_app;
          EOSQL

      # No seed step here, unlike integration-tests — apps/e2e's own
      # global-setup.ts seeds one isolated fixture company per scenario
      # directly (see apps/e2e/fixtures/seed.ts), not the generic demo
      # company packages/db/prisma/seed.ts creates.
      - name: Run Playwright suite
        working-directory: apps/e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  native-install:
    name: Native install (real Postgres/Redis/nginx, no Docker)
    runs-on: ubuntu-latest
    # No job here had an upper time bound, so GitHub's 6-hour default
    # applied: a hung step burned runner time for hours and never
    # self-reported. Found when a migration blocked on a database lock and
    # native-upgrade sat in_progress for an hour against a ~3 minute norm.
    # 30 is far above every job's real duration (longest observed ~8 min)
    # and far below the point where a hang stops being obvious.
    timeout-minutes: 30
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      # Mirrors deploy/native's own documented prerequisite list
      # (docs/docs/installation.md §2) — install-native.sh checks for
      # these and fails loudly with instructions if they're missing, it
      # never installs them itself. This is what keeps the native path
      # a permanently-verified install target instead of a one-off VM
      # check (see CLAUDE.md's "Native install — real VM verification"
      # entry, which found 8 real bugs a static read of the scripts
      # never would have).
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server nginx build-essential python3
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo systemctl enable --now postgresql
          sudo systemctl enable --now redis-server

      - name: Wait for Postgres and Redis
        run: |
          for i in $(seq 1 30); do sudo -u postgres pg_isready && break; [ "$i" -eq 30 ] && { echo "::error::Postgres never became ready"; exit 1; }; sleep 1; done
          for i in $(seq 1 30); do redis-cli ping | grep -q PONG && break; [ "$i" -eq 30 ] && { echo "::error::Redis never became ready"; exit 1; }; sleep 1; done

      # install-native.sh runs setup-database.sh itself as part of the
      # documented flow (see deploy/native/install-native.sh) — this is
      # the same single command an admin runs, not a CI-only shortcut.
      #
      # `set -o pipefail` matters here, not just style: a real first run
      # of this job reported this step as a 0-second success while
      # install-native.sh had actually failed near-instantly — GitHub
      # Actions' default bash `run:` doesn't set pipefail, so
      # `cmd | tee file`'s reported exit code was tee's (always 0), not
      # install-native.sh's. The health-check step below caught the
      # resulting broken install, but the real failure reason was masked
      # by this step reporting green. Same class of bug CLAUDE.md's
      # "Native install — 8 real bugs" entry documents for the script
      # itself (bug #2/#5, stdout-capture and errexit-propagation
      # footguns) — this one was in the CI YAML wrapping it, not the
      # script.
      # TEMPORARY DIAGNOSTIC — carries no assertion and must not fail the
      # job. Investigating why pnpm's _linkBins does
      #   mkdir '$HOME/opt/openestate/releases/<id>'
      # i.e. $HOME prefixed onto an absolute path with its ../ prefix
      # stripped. native-install runs the identical build_release as the
      # same user and succeeds, so the same block runs in BOTH jobs and the
      # two outputs are meant to be diffed. Remove once the cause is known.
      - name: DIAGNOSTIC - environment immediately before the script runs
        continue-on-error: true
        run: |
          set -uo pipefail
          . deploy/native/lib.sh
          SRC_DIR="$GITHUB_WORKSPACE"
          OWNER="$(src_owner "$SRC_DIR")"

          echo "::group::ownership and mode: /opt/openestate and every parent up to /"
          for d in / /opt /opt/openestate /opt/openestate/releases; do
            if [ -e "$d" ]; then
              stat -c '%n  owner=%U  group=%G  mode=%A  type=%F' "$d"
              rl="$(readlink -f "$d")"; [ "$rl" = "$d" ] || echo "    ^ resolves to: $rl  (NOT itself - symlink in the path)"
            else
              echo "$d  (does not exist)"
            fi
          done
          echo "::endgroup::"

          echo "::group::what already exists in /opt/openestate/releases"
          ls -la /opt/openestate/releases 2>&1 || echo "(cannot list)"
          echo "::endgroup::"

          echo "::group::build user, and a REAL write test (not inferred from mode bits)"
          echo "src_owner($SRC_DIR) = $OWNER"
          echo "this step runs as    = $(id -un) uid=$(id -u)"
          echo "id of build user     : $(id "$OWNER" 2>&1)"
          if [ -d /opt/openestate/releases ]; then
            probe="/opt/openestate/releases/.diag-probe-$$"
            if runuser -u "$OWNER" -- mkdir "$probe" 2>&1; then
              echo "WRITE TEST: '$OWNER' CAN create entries in /opt/openestate/releases"
              runuser -u "$OWNER" -- rmdir "$probe" 2>&1 || true
            else
              echo "WRITE TEST: '$OWNER' CANNOT create entries in /opt/openestate/releases"
            fi
          else
            echo "WRITE TEST: skipped - /opt/openestate/releases does not exist yet"
          fi
          echo "::endgroup::"

          echo "::group::the build user's environment INSIDE runuser (what build_release sees)"
          echo "-- plain 'runuser -u OWNER --', the exact form run_as_src_owner uses --"
          runuser -u "$OWNER" -- sh -c 'echo "HOME=$HOME"; echo "PWD=$PWD"; echo "USER=${USER:-<unset>}"; echo "LOGNAME=${LOGNAME:-<unset>}"; echo "XDG_DATA_HOME=${XDG_DATA_HOME:-<unset>}"; echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}"; echo "npm_config_prefix=${npm_config_prefix:-<unset>}"; echo "PATH=$PATH"' 2>&1
          echo "-- same, but cwd set to the checkout the way _build_in_checkout does --"
          ( cd "$SRC_DIR" && runuser -u "$OWNER" -- sh -c 'echo "HOME=$HOME"; echo "PWD=$PWD"; echo "pwd -P=$(pwd -P)"' ) 2>&1
          echo "::endgroup::"

          echo "::group::pnpm's own view, as the build user, from the checkout"
          ( cd "$SRC_DIR" && runuser -u "$OWNER" -- sh -c 'echo "store path : $(pnpm store path 2>&1)"; echo "store-dir  : $(pnpm config get store-dir 2>&1)"; echo "global-dir : $(pnpm config get global-dir 2>&1)"; echo "pnpm ver   : $(pnpm --version 2>&1)"' ) 2>&1
          echo "::endgroup::"

      - name: Run install-native.sh (builds the app, runs setup-database.sh, installs systemd + nginx)
        working-directory: deploy/native
        run: |
          set -o pipefail
          START=$(date +%s)
          # Invoked exactly as the docs tell a real admin to run it (`sudo
          # ./install-native.sh`, NOT `sudo bash install-native.sh`) — a
          # `bash` prefix would exec the script as bash's file argument,
          # which doesn't require the executable bit and so silently
          # masked a real bug this job caught once: install-native.sh's
          # own git-tracked mode (and setup-database.sh's, which it execs
          # directly) was 100644, no +x. A genuinely fresh `git clone` +
          # documented `sudo ./install-native.sh` failed with exit 126
          # ("Permission denied") the moment it tried to exec
          # setup-database.sh — invisible on the VM this was verified on
          # because that checkout had accumulated a local chmod that was
          # never committed. Fixed by setting the tracked mode to 100755
          # for every deploy/native script real users invoke directly
          # (install/upgrade/backup/restore/uninstall/setup-database —
          # lib.sh stays 644, it's only ever sourced). This step must keep
          # testing the exact documented invocation so a regression here
          # (e.g. a future script losing +x again) fails CI instead of
          # being quietly bypassed by a `bash` wrapper.
          sudo ./install-native.sh 2>&1 | tee /tmp/install-native.log
          END=$(date +%s)
          DURATION=$((END - START))
          echo "install-native.sh ran for ${DURATION}s"
          # A genuine build (pnpm install alone is 30-60s, the full
          # multi-package build several minutes more) can never
          # legitimately finish in under a minute. Catches a false-0
          # exit code the same class of masking bug this step already
          # hit once, even if some future change reintroduces it a
          # different way.
          if [ "$DURATION" -lt 60 ]; then
            echo "::error::install-native.sh reported success in only ${DURATION}s — too fast to be a real build+install, treating as a failure regardless of exit code"
            exit 1
          fi

      - name: Show install-native.sh output on failure
        if: failure()
        run: |
          echo "::group::Full install-native.sh output"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/install-native.log 2>/dev/null || echo "(no log file at /tmp/install-native.log)"
          echo "::endgroup::"
          # GitHub caps annotations at 10 per step and keeps the first 10
          # emitted, not the last — a previous run of this step emitted
          # `tail -n 30` in chronological order and the surviving 10
          # annotations were lines 30..21 from the end, nowhere near the
          # actual failure. Emitting only the true last 9 lines (+ this
          # header = 10) guarantees the failure itself survives the cap.
          echo "::error::install-native.sh failed — last lines (ANSI codes stripped):"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/install-native.log 2>/dev/null | tail -n 9 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Assert health endpoint responds over HTTP
        run: curl -fsS http://localhost/api/v1/health

      - name: Assert login succeeds over HTTP
        run: |
          PASSWORD="$(grep -m1 '^   password:' /tmp/install-native.log | awk '{print $2}')"
          [ -n "$PASSWORD" ] || { echo "::error::could not find the seeded admin password in the install log"; exit 1; }
          RESPONSE="$(curl -fsS -X POST http://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@demo-realty.com\",\"password\":\"${PASSWORD}\"}")"
          echo "$RESPONSE" | grep -q '"accessToken"' || { echo "::error::login response had no accessToken: $RESPONSE"; exit 1; }
          echo "Login over HTTP succeeded."

      - name: Dump journalctl on failure
        if: failure()
        run: |
          echo "::group::journalctl -u openestate-api"
          sudo journalctl -u openestate-api -n 300 --no-pager || echo "(unit not found / never started)"
          echo "::endgroup::"
          # Each step gets its own separate 10-annotation cap (see the
          # earlier commit fixing the same truncation on the install-log
          # step) — kept to 8 lines + this header so nothing here gets
          # silently dropped the way a 20-line dump would.
          echo "::error::journalctl -u openestate-api (last 8 lines):"
          (sudo journalctl -u openestate-api -n 8 --no-pager 2>/dev/null || echo "(unit not found / never started)") | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Dump nginx/postgres status on failure
        if: failure()
        run: |
          echo "::group::systemctl status postgresql"
          sudo systemctl status postgresql --no-pager || true
          echo "::endgroup::"
          echo "::group::nginx -T"
          sudo nginx -T || true
          echo "::endgroup::"

      - name: Check dmesg for segfaults on failure
        if: failure()
        run: |
          echo "::group::dmesg segfault entries"
          sudo dmesg -T 2>/dev/null | grep -iE 'segfault|general protection' || echo "(none / dmesg unavailable)"
          echo "::endgroup::"
          # Names the exact crashing binary/library + offset — the single
          # most useful signal for a native-module SIGSEGV, which is
          # otherwise invisible: systemd's own log only shows "Main
          # process exited, code=dumped, status=11/SEGV", never why.
          echo "::error::dmesg segfault entries (names the exact crashing binary/library):"
          (sudo dmesg -T 2>/dev/null | grep -iE 'segfault|general protection' || echo "(none found)") | tail -n 8 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Coredump backtrace on failure
        if: failure()
        run: |
          # dmesg found nothing on a prior run — expected, not a dead end:
          # kernel.print-fatal-signals defaults off on Ubuntu, so a plain
          # SIGSEGV never reaches dmesg at all; systemd-coredump (which DID
          # catch it — "Failed with result 'core-dump'" in journalctl) is
          # the real source for a backtrace naming the crashing frame.
          sleep 2
          echo "::group::coredumpctl list"
          sudo coredumpctl list --no-pager 2>&1 || echo "(coredumpctl unavailable or no dumps)"
          echo "::endgroup::"
          BT="$(sudo coredumpctl info --no-pager 2>&1 | tail -n 40)"
          echo "::group::coredumpctl info (most recent dump, full)"
          echo "$BT"
          echo "::endgroup::"
          echo "::error::coredumpctl backtrace (names the crashing frame):"
          echo "$BT" | tail -n 9 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  native-upgrade-from-populated:
    # Both bugs in CLAUDE.md's "v0.2.0 — upgrade-path permission delivery"
    # entry (permissions never synced to an existing install; system roles
    # rejecting permission edits) were invisible to every prior CI job and
    # VM walkthrough because every one of them started from a FRESH
    # install. This job starts from a POPULATED, PREVIOUSLY-CUSTOMISED
    # install instead — the only way to catch "does an upgrade actually
    # deliver new stuff, and leave old stuff alone" as a real regression
    # gate instead of a one-off manual check.
    name: Native upgrade (populated DB, real Postgres/Redis/nginx)
    runs-on: ubuntu-latest
    # No job here had an upper time bound, so GitHub's 6-hour default
    # applied: a hung step burned runner time for hours and never
    # self-reported. Found when a migration blocked on a database lock and
    # native-upgrade sat in_progress for an hour against a ~3 minute norm.
    # 30 is far above every job's real duration (longest observed ~8 min)
    # and far below the point where a hang stops being obvious.
    timeout-minutes: 30
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need real history to check out an older ref, then return to HEAD

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server nginx build-essential python3 jq
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo systemctl enable --now postgresql
          sudo systemctl enable --now redis-server

      - name: Wait for Postgres and Redis
        run: |
          for i in $(seq 1 30); do sudo -u postgres pg_isready && break; [ "$i" -eq 30 ] && { echo "::error::Postgres never became ready"; exit 1; }; sleep 1; done
          for i in $(seq 1 30); do redis-cli ping | grep -q PONG && break; [ "$i" -eq 30 ] && { echo "::error::Redis never became ready"; exit 1; }; sleep 1; done

      - name: Check out the previous-release baseline
        run: |
          # v0.1.2 itself still pins the old `argon2` native package, which
          # SIGSEGVs at module-LOAD time specifically on GitHub's
          # ubuntu-latest hosted runners (see CLAUDE.md's two SIGSEGV
          # investigations, resolved by replacing it with @node-rs/argon2
          # in c2c32e0) — installing literal v0.1.2 here would crash during
          # the very first seed step, for a reason that has nothing to do
          # with what this job tests. c2c32e0 is the oldest ref that can
          # reliably install on this runner class, so it stands in for
          # "the previous release" as this job's baseline. If a real
          # tagged release ever supersedes v0.1.2, point this at that tag
          # instead.
          BASELINE_REF=c2c32e0
          echo "Baseline ref: ${BASELINE_REF} ($(git log -1 --format='%h %s' "$BASELINE_REF"))"
          git checkout "$BASELINE_REF"

      - name: Install the baseline release
        working-directory: deploy/native
        run: |
          set -o pipefail
          sudo ./install-native.sh 2>&1 | tee /tmp/install-baseline.log
          PASSWORD="$(grep -m1 '^   password:' /tmp/install-baseline.log | awk '{print $2}')"
          [ -n "$PASSWORD" ] || { echo "::error::no admin password found in the baseline install log"; exit 1; }
          echo "ADMIN_PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"

      - name: Seed and customise data on the baseline release, over real HTTP
        run: |
          set -euo pipefail
          COOKIES=/tmp/cookies-baseline.txt
          LOGIN="$(curl -fsS -c "$COOKIES" -X POST http://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@demo-realty.com\",\"password\":\"${ADMIN_PASSWORD}\"}")"
          TOKEN="$(echo "$LOGIN" | jq -r .accessToken)"
          CSRF="$(grep openestate_csrf "$COOKIES" | awk '{print $NF}')"
          # No -f: on an HTTP error, -f suppresses the response body entirely
          # (just a bare "curl: (22)" and nothing else to debug from) — every
          # call site below checks the actual JSON shape it got back instead,
          # so a real failure prints the server's own error message.
          auth()   { curl -sS -b "$COOKIES" -H "Authorization: Bearer ${TOKEN}" "$@"; }
          mutate() { curl -sS -b "$COOKIES" -H "Authorization: Bearer ${TOKEN}" -H "X-CSRF-Token: ${CSRF}" -H 'Content-Type: application/json' "$@"; }

          # Sanity check the baseline is genuinely "before" — if v0.2.0's
          # permission already exists here, this job's premise is broken
          # and every later assertion would be meaningless.
          ALL_PERMS="$(auth http://localhost/api/v1/roles/permissions)"
          if echo "$ALL_PERMS" | jq -e '.[] | select(.key=="inventory.unit.plc-manage")' > /dev/null; then
            echo "::error::inventory.unit.plc-manage already present on the baseline release — BASELINE_REF is no longer 'previous', update it"
            exit 1
          fi

          # Customise a seeded master: deactivate "Website" (Inquiry
          # Source). Must survive the upgrade untouched — an admin who
          # deactivated a default master should never see it resurrected.
          WEBSITE_ID="$(auth http://localhost/api/v1/masters/inquiry-sources | jq -r '.data[] | select(.name=="Website") | .id')"
          [ -n "$WEBSITE_ID" ] && [ "$WEBSITE_ID" != "null" ] || { echo "::error::'Website' inquiry source not found on the baseline install"; exit 1; }
          mutate -X PATCH "http://localhost/api/v1/masters/inquiry-sources/${WEBSITE_ID}" -d '{"isActive": false}' > /dev/null

          # Customise roles: create a custom (non-system) role with a
          # deliberately narrow permission set — exactly the kind of
          # admin-owned data sync-permissions.ts's own doc comment says
          # must never be touched by an automatic sync. Must survive
          # byte-for-byte. Slug uses underscores, not hyphens: the baseline
          # release's createRoleSchema (fixed later, in c86689b) only
          # accepted [a-z][a-z0-9_]* — a hyphen here 400s on baseline.
          READ_PERM_ID="$(echo "$ALL_PERMS" | jq -r '.[] | select(.key=="admin.role.read") | .id')"
          CREATE_RES="$(mutate -X POST http://localhost/api/v1/roles \
            -d "{\"name\":\"E2E Upgrade Custom Role\",\"slug\":\"e2e_upgrade_custom_role\",\"permissionIds\":[\"${READ_PERM_ID}\"]}")"
          CUSTOM_ROLE_ID="$(echo "$CREATE_RES" | jq -r .id)"
          [ -n "$CUSTOM_ROLE_ID" ] && [ "$CUSTOM_ROLE_ID" != "null" ] || { echo "::error::failed to create the custom role on baseline: ${CREATE_RES}"; exit 1; }

          # A seeded SYSTEM role, to prove after the upgrade that it can be
          # granted the new permission (the RolesService fix) — captured
          # now so the assertion step doesn't have to re-derive it.
          SYSTEM_ROLE_ID="$(auth http://localhost/api/v1/roles | jq -r '.[] | select(.slug=="company_admin") | .id')"
          [ -n "$SYSTEM_ROLE_ID" ] && [ "$SYSTEM_ROLE_ID" != "null" ] || { echo "::error::company_admin system role not found on the baseline install"; exit 1; }

          echo "WEBSITE_ID=${WEBSITE_ID}" >> "$GITHUB_ENV"
          echo "CUSTOM_ROLE_ID=${CUSTOM_ROLE_ID}" >> "$GITHUB_ENV"
          echo "SYSTEM_ROLE_ID=${SYSTEM_ROLE_ID}" >> "$GITHUB_ENV"

      - name: Check out the current release
        run: git checkout "${{ github.sha }}"

      # The baseline install above ran the PRE-FIX install-native.sh, which
      # built as root and left root-owned node_modules/ and dist/ in the
      # checkout. The build now correctly runs as the checkout's owner, who
      # cannot replace those files — so upgrade-native.sh refuses that state
      # up front rather than dying part-way through the build with a raw
      # "EACCES: permission denied, unlink ...".
      #
      # This step is the operator doing exactly what that refusal instructs.
      # It reuses the script's own _build_artifact_paths(), so CI can never
      # repair a different set of paths than the check inspects — if the two
      # ever drift, this step stops fixing the thing that blocks the upgrade
      # and the job fails, which is the correct outcome.
      #
      # Every real install done with the older scripts needs this same
      # one-time repair; that is the transition this job reproduces.
      - name: Clear the baseline install's modules directories
        run: |
          set -euo pipefail
          # The baseline install above ran the PRE-FIX install-native.sh,
          # which built as root. That leaves two independent problems, and
          # this step is the operator applying the remedy the script's own
          # refusals instruct:
          #
          #   1. root-owned build artifacts the new build user cannot
          #      replace -> chown, and
          #   2. a node_modules built against ROOT's pnpm store, which the
          #      build user's pnpm treats as foreign and refuses to install
          #      into (it either no-ops and lets the build fail later with a
          #      misleading "Cannot find module ...", or wipes the tree
          #      unattended).
          #
          # (2) is not fixed by (1) — a chown makes the files writable and
          # leaves the tree just as foreign — so the remedy for the modules
          # directories is removal, not ownership repair. Removing them
          # subsumes the chown for those paths, and the build recreates them
          # against the correct store.
          #
          # Uses the script's own _build_artifact_paths(), so CI can never
          # act on a different set than the checks inspect.
          #
          # NOTE FOR WHOEVER READS THIS NEXT: with this step in place, this
          # job no longer reproduces the inherited-artifacts state end to
          # end — it repairs it and then exercises the upgrade. The two
          # refusals themselves are proved by native-upgrade-refspec (cases
          # 6 and 7), which can construct those states without an install.
          # This job's value is the FULL transition afterwards: build,
          # migrate, cutover, healthcheck and the permission-delivery
          # assertions. Do not delete this step expecting the refusals to
          # still be covered here; they are not.
          . deploy/native/lib.sh
          mapfile -t modules_dirs < <(_build_artifact_paths "$GITHUB_WORKSPACE" | grep '/node_modules$' || true)
          echo "Removing ${#modules_dirs[@]} modules directory(ies):"
          printf '  %s\n' "${modules_dirs[@]}"
          if [ "${#modules_dirs[@]}" -gt 0 ]; then
            sudo rm -rf "${modules_dirs[@]}"
          fi
          # Any remaining root-owned artifacts (dist/, .turbo/, tsbuildinfo)
          # are still unwritable by the build user, so they get the chown the
          # ownership refusal asks for.
          mapfile -t rest < <(_build_artifact_paths "$GITHUB_WORKSPACE" || true)
          if [ "${#rest[@]}" -gt 0 ]; then
            echo "Chowning ${#rest[@]} remaining artifact path(s) to 'runner'"
            sudo chown -R runner: "${rest[@]}"
          fi

      # TEMPORARY DIAGNOSTIC — carries no assertion and must not fail the
      # job. Investigating why pnpm's _linkBins does
      #   mkdir '$HOME/opt/openestate/releases/<id>'
      # i.e. $HOME prefixed onto an absolute path with its ../ prefix
      # stripped. native-install runs the identical build_release as the
      # same user and succeeds, so the same block runs in BOTH jobs and the
      # two outputs are meant to be diffed. Remove once the cause is known.
      - name: DIAGNOSTIC - environment immediately before the script runs
        continue-on-error: true
        run: |
          set -uo pipefail
          . deploy/native/lib.sh
          SRC_DIR="$GITHUB_WORKSPACE"
          OWNER="$(src_owner "$SRC_DIR")"

          echo "::group::ownership and mode: /opt/openestate and every parent up to /"
          for d in / /opt /opt/openestate /opt/openestate/releases; do
            if [ -e "$d" ]; then
              stat -c '%n  owner=%U  group=%G  mode=%A  type=%F' "$d"
              rl="$(readlink -f "$d")"; [ "$rl" = "$d" ] || echo "    ^ resolves to: $rl  (NOT itself - symlink in the path)"
            else
              echo "$d  (does not exist)"
            fi
          done
          echo "::endgroup::"

          echo "::group::what already exists in /opt/openestate/releases"
          ls -la /opt/openestate/releases 2>&1 || echo "(cannot list)"
          echo "::endgroup::"

          echo "::group::build user, and a REAL write test (not inferred from mode bits)"
          echo "src_owner($SRC_DIR) = $OWNER"
          echo "this step runs as    = $(id -un) uid=$(id -u)"
          echo "id of build user     : $(id "$OWNER" 2>&1)"
          if [ -d /opt/openestate/releases ]; then
            probe="/opt/openestate/releases/.diag-probe-$$"
            if runuser -u "$OWNER" -- mkdir "$probe" 2>&1; then
              echo "WRITE TEST: '$OWNER' CAN create entries in /opt/openestate/releases"
              runuser -u "$OWNER" -- rmdir "$probe" 2>&1 || true
            else
              echo "WRITE TEST: '$OWNER' CANNOT create entries in /opt/openestate/releases"
            fi
          else
            echo "WRITE TEST: skipped - /opt/openestate/releases does not exist yet"
          fi
          echo "::endgroup::"

          echo "::group::the build user's environment INSIDE runuser (what build_release sees)"
          echo "-- plain 'runuser -u OWNER --', the exact form run_as_src_owner uses --"
          runuser -u "$OWNER" -- sh -c 'echo "HOME=$HOME"; echo "PWD=$PWD"; echo "USER=${USER:-<unset>}"; echo "LOGNAME=${LOGNAME:-<unset>}"; echo "XDG_DATA_HOME=${XDG_DATA_HOME:-<unset>}"; echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}"; echo "npm_config_prefix=${npm_config_prefix:-<unset>}"; echo "PATH=$PATH"' 2>&1
          echo "-- same, but cwd set to the checkout the way _build_in_checkout does --"
          ( cd "$SRC_DIR" && runuser -u "$OWNER" -- sh -c 'echo "HOME=$HOME"; echo "PWD=$PWD"; echo "pwd -P=$(pwd -P)"' ) 2>&1
          echo "::endgroup::"

          echo "::group::pnpm's own view, as the build user, from the checkout"
          ( cd "$SRC_DIR" && runuser -u "$OWNER" -- sh -c 'echo "store path : $(pnpm store path 2>&1)"; echo "store-dir  : $(pnpm config get store-dir 2>&1)"; echo "global-dir : $(pnpm config get global-dir 2>&1)"; echo "pnpm ver   : $(pnpm --version 2>&1)"' ) 2>&1
          echo "::endgroup::"

      - name: Run upgrade-native.sh
        working-directory: deploy/native
        run: |
          set -o pipefail
          START=$(date +%s)
          # --no-backup: backup-native.sh needs no external creds (it dumps
          # locally), but this job is testing the upgrade sequence itself,
          # not the backup step — skip it to keep the job focused and fast.
          #
          # --ref is passed explicitly, and the "Check out the current
          # release" step above deliberately STAYS. This job's scope is
          # "given a correct checkout, does the upgrade deliver" — real
          # coverage, but NOT coverage of ref handling, since the harness
          # positions the checkout itself. Ref handling is covered by the
          # native-upgrade-refspec job instead, which drives the script's
          # own resolution logic against a scratch repository.
          #
          # Dropping the pre-positioning step was tried and reverted: with
          # the checkout left at the baseline, `./upgrade-native.sh` resolves
          # to the BASELINE's copy of the script (the script ships inside the
          # tree being upgraded), so the job silently tested an old script.
          # Do not remove that step again.
          sudo ./upgrade-native.sh --no-backup --ref "${{ github.sha }}" 2>&1 | tee /tmp/upgrade.log
          END=$(date +%s)
          DURATION=$((END - START))
          echo "upgrade-native.sh ran for ${DURATION}s"
          if [ "$DURATION" -lt 20 ]; then
            echo "::error::upgrade-native.sh reported success in only ${DURATION}s — too fast to be a real build+migrate+cutover, treating as a failure regardless of exit code"
            exit 1
          fi

      - name: Assert the app boots healthy after upgrade
        run: curl -fsS http://localhost/api/v1/health

      - name: Assert nothing was lost, and new permissions arrived
        run: |
          set -euo pipefail
          COOKIES=/tmp/cookies-upgraded.txt
          LOGIN="$(curl -sS -c "$COOKIES" -X POST http://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@demo-realty.com\",\"password\":\"${ADMIN_PASSWORD}\"}")"
          echo "$LOGIN" | jq -e '.accessToken' > /dev/null || { echo "::error::login with the ORIGINAL admin password failed after upgrade — a real customer's session/credentials must survive an upgrade: ${LOGIN}"; exit 1; }
          TOKEN="$(echo "$LOGIN" | jq -r .accessToken)"
          CSRF="$(grep openestate_csrf "$COOKIES" | awk '{print $NF}')"
          # No -f, same reasoning as the baseline-customisation step: every
          # call site below checks the JSON shape it got back explicitly.
          auth()   { curl -sS -b "$COOKIES" -H "Authorization: Bearer ${TOKEN}" "$@"; }
          mutate() { curl -sS -b "$COOKIES" -H "Authorization: Bearer ${TOKEN}" -H "X-CSRF-Token: ${CSRF}" -H 'Content-Type: application/json' "$@"; }

          # 1. The deactivated master stayed deactivated — not resurrected.
          WEBSITE_ACTIVE="$(auth "http://localhost/api/v1/masters/inquiry-sources/${WEBSITE_ID}" | jq -r .isActive)"
          [ "$WEBSITE_ACTIVE" = "false" ] || { echo "::error::'Website' inquiry source is active again after upgrade (was deactivated pre-upgrade) — a master sync resurrected admin-deleted data"; exit 1; }

          # 2. The custom role's permission set is byte-for-byte unchanged.
          CUSTOM_ROLE="$(auth "http://localhost/api/v1/roles/${CUSTOM_ROLE_ID}")"
          CUSTOM_ROLE_PERM_COUNT="$(echo "$CUSTOM_ROLE" | jq '.permissions | length')"
          [ "$CUSTOM_ROLE_PERM_COUNT" = "1" ] || { echo "::error::custom role's permission count changed across the upgrade (expected 1, got ${CUSTOM_ROLE_PERM_COUNT}): ${CUSTOM_ROLE}"; exit 1; }
          echo "$CUSTOM_ROLE" | jq -e '.permissions[0].permission.key == "admin.role.read"' > /dev/null || { echo "::error::custom role's permission changed across the upgrade: ${CUSTOM_ROLE}"; exit 1; }

          # 3. v0.2.0's new permissions arrived (the sync-permissions.ts fix).
          ALL_PERMS_AFTER="$(auth http://localhost/api/v1/roles/permissions)"
          for KEY in inventory.unit.plc-manage inventory.unit.charge-manage; do
            echo "$ALL_PERMS_AFTER" | jq -e --arg k "$KEY" '.[] | select(.key == $k)' > /dev/null \
              || { echo "::error::permission '${KEY}' did not arrive after upgrade — sync-permissions.ts regression"; exit 1; }
          done

          # 3b. super_admin must hold EVERY permission after an upgrade.
          # Assertion 3 above only proves the permission ROWS arrived; it
          # says nothing about whether any role can actually USE them.
          # That gap shipped for four consecutive releases, each with this
          # job green: on a real v0.1.2 -> v0.2.3 upgrade of the
          # 192.168.1.2 VM, `permissions` had all 142 rows while
          # super_admin still held only the 140 it was seeded with,
          # silently making v0.2.0's PLC pricing UI unreachable on every
          # upgraded install. super_admin is the only role this is
          # assertable for — ROLE_PERMISSIONS.super_admin is literally
          # Object.values(PERMISSIONS), so "all of them" is its
          # definition, not a default. Every other role is deliberately
          # left alone (an admin may have narrowed it), which is why this
          # check is scoped to this one slug.
          ROLES_AFTER="$(auth http://localhost/api/v1/roles)"
          echo "$ROLES_AFTER" | jq -e '.[] | select(.slug=="super_admin")' > /dev/null \
            || { echo "::error::no super_admin role found after upgrade — cannot verify permission completeness"; exit 1; }
          echo "$ALL_PERMS_AFTER" | jq -r '.[].key' | sort > /tmp/all-perm-keys.txt
          echo "$ROLES_AFTER" | jq -r '.[] | select(.slug=="super_admin") | .permissions[].permission.key' | sort > /tmp/super-admin-keys.txt
          MISSING_FOR_SUPER="$(comm -23 /tmp/all-perm-keys.txt /tmp/super-admin-keys.txt || true)"
          if [ -n "$MISSING_FOR_SUPER" ]; then
            echo "::error::super_admin is missing $(echo "$MISSING_FOR_SUPER" | wc -l) permission(s) after upgrade — a release added permissions that the most privileged role cannot use. Missing: $(echo "$MISSING_FOR_SUPER" | tr '\n' ' ')"
            exit 1
          fi
          echo "super_admin holds all $(wc -l < /tmp/all-perm-keys.txt) permissions after upgrade."

          # 4. A SEEDED SYSTEM ROLE can be granted the new permission — the
          # RolesService fix (task #63) exercised through the actual
          # upgrade path, not just a fresh install.
          PLC_PERM_ID="$(echo "$ALL_PERMS_AFTER" | jq -r '.[] | select(.key=="inventory.unit.plc-manage") | .id')"
          SYSTEM_ROLE_BEFORE="$(auth "http://localhost/api/v1/roles/${SYSTEM_ROLE_ID}")"
          SYSTEM_ROLE_NAME="$(echo "$SYSTEM_ROLE_BEFORE" | jq -r .name)"
          EXISTING_PERM_IDS="$(echo "$SYSTEM_ROLE_BEFORE" | jq -c '[.permissions[].permission.id]')"
          NEW_PERM_IDS="$(echo "$EXISTING_PERM_IDS" | jq -c --arg p "$PLC_PERM_ID" '. + [$p]')"
          GRANT_RES="$(mutate -X PATCH "http://localhost/api/v1/roles/${SYSTEM_ROLE_ID}" \
            -d "{\"name\":\"${SYSTEM_ROLE_NAME}\",\"permissionIds\":${NEW_PERM_IDS}}")"
          echo "$GRANT_RES" | jq -e --arg k "inventory.unit.plc-manage" '.permissions[].permission.key | select(. == $k)' > /dev/null \
            || { echo "::error::granting the new permission to a seeded system role failed after upgrade: ${GRANT_RES}"; exit 1; }

          echo "All upgrade-path assertions passed: master customisation preserved, custom role preserved, new permissions delivered, system role can be granted them."

      - name: Dump journalctl on failure
        if: failure()
        run: |
          echo "::group::journalctl -u openestate-api"
          sudo journalctl -u openestate-api -n 300 --no-pager || echo "(unit not found / never started)"
          echo "::endgroup::"
          echo "::error::journalctl -u openestate-api (last 8 lines):"
          (sudo journalctl -u openestate-api -n 8 --no-pager 2>/dev/null || echo "(unit not found / never started)") | while IFS= read -r line; do
            echo "::error::${line}"
          done


  native-upgrade-refspec:
    # upgrade-native.sh decides WHAT to build before it builds anything:
    # it refuses a checkout it cannot verify, and resolves --ref against
    # the remote. native-upgrade-from-populated cannot test any of that —
    # it positions the checkout itself, on purpose (see its own comment),
    # so the script's decision never runs there.
    #
    # This job tests only that decision, and needs nothing to do it: no
    # install, no PostgreSQL, no Redis, no systemd, no nginx, no Node or
    # pnpm. That is a property of the script, not a shortcut — the whole
    # ref-decision block runs before the first backup, build, migration,
    # systemctl call or healthcheck. If this job ever needs one of those
    # services, the decision has stopped being reachable before the build,
    # which is itself the bug.
    name: Upgrade ref handling (no install, no services)
    runs-on: ubuntu-latest
    # Deliberately no `needs:` — this job builds and installs nothing, so
    # gating it behind lint-typecheck-build would only delay the fastest
    # signal in the workflow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a scratch origin is built from this history

      - name: Create the fake install target and the pnpm stub
        run: |
          set -euo pipefail
          # upgrade-native.sh has exactly two preconditions before its ref
          # decision: it must run as root, and /opt/openestate/current must
          # be a symlink. Nothing here installs OpenEstate — the script
          # never reads THROUGH this symlink before the point under test,
          # it only checks that it is one and resolves it for its "previous
          # release" message.
          sudo mkdir -p /opt/openestate/releases/fake-previous
          sudo ln -sfn /opt/openestate/releases/fake-previous /opt/openestate/current

          # The ONE stub in this job. build_release() is the first thing
          # after the ref decision, so a `pnpm` that always fails makes it
          # die in milliseconds instead of running a real multi-minute
          # build. Everything asserted below happens BEFORE this point.
          #
          # What stubbing this means the job CANNOT prove: that the build
          # produces a working release, that migrations apply, that cutover
          # or the healthcheck work. native-upgrade-from-populated proves
          # those against a real install; this job proves none of them.
          #
          # Installed at /usr/local/bin, not a bespoke directory: `sudo`
          # replaces PATH with sudoers' secure_path, so a stub anywhere
          # else would simply not be found by the script.
          # `pnpm store path` is the ONE subcommand that must SUCCEED.
          # assert_modules_store_matches() asks pnpm which store the build
          # user would use and compares it against the store recorded in
          # node_modules/.modules.yaml. A stub that fails everything makes
          # that check report "could not determine which pnpm store" — a
          # real refusal, but the wrong one, leaving case 7 asserting
          # nothing about a store MISMATCH. Everything else still fails, so
          # cases 3 and 4 keep dying in milliseconds.
          #
          # The path is hardcoded rather than derived from $HOME so the
          # answer cannot depend on how runuser sets the environment; it
          # only has to differ from the /root/... store case 7 records.
          #
          # Written with printf, not a heredoc: a heredoc body would have to
          # start at column 0, which terminates this YAML block scalar.
          printf '#!/bin/sh\ncase " $* " in\n  *" store path "*)\n    echo "/home/runner/.local/share/pnpm/store/v3"\n    exit 0\n    ;;\nesac\necho "stub pnpm: failing deliberately (native-upgrade-refspec)" >&2\nexit 1\n' \
            | sudo tee /usr/local/bin/pnpm > /dev/null
          sudo chmod +x /usr/local/bin/pnpm
          # Prove the stub does BOTH halves before any case depends on it.
          [ "$(pnpm -C / store path)" = "/home/runner/.local/share/pnpm/store/v3" ] \
            || { echo "::error::pnpm stub does not answer 'store path' — case 7 would assert the wrong refusal"; exit 1; }
          if pnpm install --frozen-lockfile >/dev/null 2>&1; then
            echo "::error::pnpm stub succeeded for 'install' — cases 3 and 4 rely on it failing fast"
            exit 1
          fi

      - name: Build a scratch origin and working clone
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/refspec"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"

          # ANTI-STALE MECHANISM 1 of 3: the script under test is obtained
          # by cloning this checkout, never by copying files. It is
          # byte-identical to the workspace's by construction. (2 is the
          # cmp gate in the next step; 3 is the per-invocation log-line
          # assertion in the case runner.)
          # `-b main` is load-bearing: without it the bare repo's HEAD points at
          # whatever init.defaultBranch is (usually `master`), the push below
          # creates `main` instead, and the clone then has an UNBORN HEAD with
          # no local branch at all — every later case fails on a bare
          # `rev-parse HEAD`. Caught by simulating this setup before shipping.
          git init --quiet --bare -b main "$SCRATCH/origin.git"
          git -C "$GITHUB_WORKSPACE" push --quiet "$SCRATCH/origin.git" "HEAD:refs/heads/main"
          git clone --quiet "$SCRATCH/origin.git" "$SCRATCH/work"

          cd "$SCRATCH/work"
          git config user.email ci@example.invalid
          git config user.name "CI"

          BASE_SHA="$(git rev-parse HEAD)"

          # A tag at the current commit, pushed to the scratch origin, so
          # --ref can resolve a real tag through a real fetch.
          git tag v-refspec-test
          git push --quiet origin v-refspec-test

          # Advance origin/main by one EMPTY commit, then rewind the local
          # branch. The local branch is now genuinely behind its upstream —
          # the exact state that produced the incident this guard exists
          # for. Empty matters: the tree is identical at both commits, so
          # checking out either one leaves the script under test unchanged.
          git commit --quiet --allow-empty -m "refspec: advance origin/main"
          git push --quiet origin main
          UPSTREAM_TIP="$(git rev-parse HEAD)"
          git reset --hard --quiet HEAD~1

          {
            echo "REFSPEC_SCRATCH=${SCRATCH}"
            echo "REFSPEC_WORK=${SCRATCH}/work"
            echo "REFSPEC_BASE_SHA=${BASE_SHA}"
            echo "REFSPEC_UPSTREAM_TIP=${UPSTREAM_TIP}"
          } >> "$GITHUB_ENV"

          echo "base commit (local main, and the tag): ${BASE_SHA}"
          echo "origin/main tip (one empty commit ahead): ${UPSTREAM_TIP}"

      - name: Assert the scratch clone's scripts match the workspace exactly
        run: |
          set -euo pipefail
          # ANTI-STALE MECHANISM 2 of 3. Covers EVERY script in
          # deploy/native, not just the two upgrade-native.sh sources at
          # runtime (lib.sh always; backup-native.sh when --no-backup is
          # absent). Comparing all of them is by construction rather than
          # by my tracing the call graph correctly — a script added to the
          # graph later is covered without anyone remembering to add it.
          differs=0
          for f in "$GITHUB_WORKSPACE"/deploy/native/*.sh; do
            base="$(basename "$f")"
            if ! cmp -s "$f" "${REFSPEC_WORK}/deploy/native/${base}"; then
              echo "::error::deploy/native/${base} in the scratch clone differs from the workspace copy. This job would be testing a script that is not the one under review — refusing to run."
              differs=1
            fi
          done
          [ "$differs" -eq 0 ] || exit 1
          echo "All $(ls "$GITHUB_WORKSPACE"/deploy/native/*.sh | wc -l) deploy/native scripts are byte-identical to the workspace."

      - name: Drive upgrade-native.sh's ref decision + inherited-state refusals (7 cases)
        run: |
          set -euo pipefail

          OUT="${RUNNER_TEMP}/refspec-case.log"
          CASE="(none)"
          EXPECTED="(none)"

          dump() {
            echo "::group::Full script output — ${CASE}"
            sed 's/\x1b\[[0-9;]*m//g' "$OUT" 2>/dev/null || echo "(no output captured)"
            echo "::endgroup::"
          }

          # Every failure names the case, the state that was built for it,
          # and what was expected — so a red run six months from now does
          # not need the setup reconstructed from the YAML.
          fail() {
            dump
            echo "::error::[CASE ${CASE}] ${1}"
            echo "::error::[CASE ${CASE}] State under test: ${EXPECTED}"
            exit 1
          }

          # ANTI-STALE MECHANISM 3 of 3, run on EVERY invocation. This line
          # is emitted only by the version of upgrade-native.sh under test.
          # Its absence means an older script executed — which is exactly
          # how a previous attempt at this coverage silently tested the
          # baseline's copy instead of the new one. Checking it positively,
          # per invocation, turns that into an immediate, named failure.
          assert_script_under_test_ran() {
            grep -q 'Source checkout .* is owned by' "$OUT" || fail \
              "the script under test did not run. Expected the line \"Source checkout ... is owned by\", which ONLY the version under review emits; its absence means an older upgrade-native.sh executed instead."
          }

          # Invoked by absolute path, still as an executable (never `sudo
          # bash <script>`), so a missing +x bit fails here the same way it
          # would for a real admin — the property native-install's own
          # comment protects.
          #
          # `|| RC=$?` is safe across this boundary specifically because
          # sudo starts a SEPARATE process: the errexit suppression that
          # applies to a command whose status is tested cannot cross into
          # it, so the script's own `set -euo pipefail` stays armed.
          run_upgrade() {
            RC=0
            sudo "${REFSPEC_WORK}/deploy/native/upgrade-native.sh" --no-backup "$@" > "$OUT" 2>&1 || RC=$?
          }

          head_sha() { git -C "$REFSPEC_WORK" rev-parse HEAD; }

          # ---------------------------------------------------------------
          CASE="1/7 — no --ref, detached HEAD"
          EXPECTED="checkout detached at ${REFSPEC_BASE_SHA} (no branch, so no upstream to compare against); the script must REFUSE rather than rebuild whatever is checked out"
          git -C "$REFSPEC_WORK" checkout --quiet --detach "$REFSPEC_BASE_SHA"
          run_upgrade
          assert_script_under_test_ran
          [ "$RC" -ne 0 ] || fail "expected a non-zero exit (a refusal), got 0. Building here would 'upgrade' to the commit already checked out and report success."
          grep -q "No --ref given, and HEAD is detached" "$OUT" || fail \
            "exited ${RC}, but not with the detached/no-upstream refusal. Expected output matching \"No --ref given, and HEAD is detached\"."
          echo "PASS ${CASE}"

          # ---------------------------------------------------------------
          CASE="2/7 — no --ref, branch behind upstream"
          EXPECTED="local branch main at ${REFSPEC_BASE_SHA}, one commit behind origin/main (${REFSPEC_UPSTREAM_TIP}); the script must REFUSE — this is the state that caused the original incident"
          git -C "$REFSPEC_WORK" checkout --quiet main
          git -C "$REFSPEC_WORK" reset --hard --quiet "$REFSPEC_BASE_SHA"
          run_upgrade
          assert_script_under_test_ran
          [ "$RC" -ne 0 ] || fail "expected a non-zero exit (a refusal), got 0. A checkout behind its upstream must not be built — that is a stale-commit upgrade reporting success."
          grep -q "commit(s) behind" "$OUT" || fail \
            "exited ${RC}, but not with the behind-upstream refusal. Expected output matching \"commit(s) behind\". (The other refusal branch is detached/no-upstream, which case 1 covers — seeing that one here means the setup did not build a tracking branch.)"
          echo "PASS ${CASE}"

          # ---------------------------------------------------------------
          CASE="3/7 — --ref with a tag"
          EXPECTED="checkout moved ahead to ${REFSPEC_UPSTREAM_TIP} first, then --ref v-refspec-test (a tag at ${REFSPEC_BASE_SHA}); the script must resolve the tag and check it out, i.e. move HEAD BACKWARD to the tag"
          git -C "$REFSPEC_WORK" checkout --quiet main
          git -C "$REFSPEC_WORK" reset --hard --quiet "$REFSPEC_UPSTREAM_TIP"
          run_upgrade --ref v-refspec-test
          assert_script_under_test_ran
          grep -q "Resolved --ref v-refspec-test to tag" "$OUT" || fail \
            "the tag was not resolved as a tag. Expected output matching \"Resolved --ref v-refspec-test to tag\"."
          ACTUAL="$(head_sha)"
          [ "$ACTUAL" = "$REFSPEC_BASE_SHA" ] || fail \
            "after the run, HEAD is ${ACTUAL} but the tag points at ${REFSPEC_BASE_SHA}. The script resolved the ref but did not check it out."
          grep -q "Build failed" "$OUT" || fail \
            "expected the run to reach the build step and fail there on the stubbed pnpm (output matching \"Build failed\"). Not reaching it means the script stopped earlier than the ref decision, so this case proved nothing about resolution."
          echo "PASS ${CASE}"

          # ---------------------------------------------------------------
          CASE="4/7 — --ref with a branch that is behind its upstream"
          EXPECTED="local branch main at ${REFSPEC_BASE_SHA}, behind origin/main (${REFSPEC_UPSTREAM_TIP}); --ref main must resolve through origin/main to the REMOTE tip, not build the stale local branch"
          git -C "$REFSPEC_WORK" checkout --quiet main
          git -C "$REFSPEC_WORK" reset --hard --quiet "$REFSPEC_BASE_SHA"
          run_upgrade --ref main
          assert_script_under_test_ran
          grep -q "Resolved --ref main to origin/main" "$OUT" || fail \
            "the branch was not resolved through origin/. Expected output matching \"Resolved --ref main to origin/main\". Resolving a branch to the LOCAL ref is the bug this case exists for: git fetch does not fast-forward a local branch, so it would build stale code and report success."
          ACTUAL="$(head_sha)"
          [ "$ACTUAL" = "$REFSPEC_UPSTREAM_TIP" ] || fail \
            "after the run, HEAD is ${ACTUAL}; expected the upstream tip ${REFSPEC_UPSTREAM_TIP}. HEAD at ${REFSPEC_BASE_SHA} would mean it built the stale local branch."
          echo "PASS ${CASE}"

          # ---------------------------------------------------------------
          CASE="5/7 — dirty working tree"
          EXPECTED="local branch main up to date with origin/main, but with an uncommitted change to a TRACKED file; the script must REFUSE, because a release built from it would not correspond to any commit"
          git -C "$REFSPEC_WORK" checkout --quiet main
          git -C "$REFSPEC_WORK" reset --hard --quiet "$REFSPEC_UPSTREAM_TIP"
          echo "# native-upgrade-refspec dirty-tree case" >> "$REFSPEC_WORK/README.md"
          run_upgrade
          assert_script_under_test_ran
          [ "$RC" -ne 0 ] || fail "expected a non-zero exit (a refusal), got 0. A dirty tree must not be built."
          grep -q "uncommitted changes" "$OUT" || fail \
            "exited ${RC}, but not with the dirty-tree refusal. Expected output matching \"uncommitted changes\"."
          git -C "$REFSPEC_WORK" checkout --quiet -- README.md
          echo "PASS ${CASE}"

          # ---------------------------------------------------------------
          # Not a ref case — an ownership one, covered here because it is the
          # other refusal that must fire before anything is built, and this
          # is the only job that can construct it without a real install.
          CASE="6/7 — inherited root-owned build artifacts"
          EXPECTED="clean, up-to-date checkout owned by 'runner', but containing a ROOT-owned node_modules/ — the state an install performed with the older root-building scripts leaves behind; the script must REFUSE up front rather than fail part-way through the build with a raw EACCES"
          git -C "$REFSPEC_WORK" checkout --quiet main
          git -C "$REFSPEC_WORK" reset --hard --quiet "$REFSPEC_UPSTREAM_TIP"
          sudo mkdir -p "$REFSPEC_WORK/node_modules"
          sudo chown -R root:root "$REFSPEC_WORK/node_modules"
          run_upgrade
          assert_script_under_test_ran
          [ "$RC" -ne 0 ] || fail "expected a non-zero exit (a refusal), got 0. Building against artifacts the build user cannot replace fails later with a bare EACCES from inside pnpm, which is what this refusal exists to prevent."
          grep -q "build artifacts owned by another user" "$OUT" || fail \
            "exited ${RC}, but not with the artifact-ownership refusal. Expected output matching \"build artifacts owned by another user\". (The other early refusals are the ref ones covered by cases 1-5, and the git-metadata one, which reports \"Cannot read git state\" — seeing either of those here means the setup built the wrong state.)"
          grep -q "sudo chown -R runner:" "$OUT" || fail \
            "the refusal fired but did not print a copy-pasteable fix command naming the build user. An operator must not have to construct the chown themselves."
          grep -q "node_modules" "$OUT" || fail \
            "the refusal did not name the offending path. Every offending path must be listed, not just counted."
          if [ -n "${REFSPEC_WORK:-}" ]; then sudo rm -rf "${REFSPEC_WORK}/node_modules"; fi
          echo "PASS ${CASE}"

          # ---------------------------------------------------------------
          # The second inherited-state condition, and deliberately built so
          # the FIRST one cannot fire: node_modules is owned by 'runner', so
          # the ownership check passes cleanly, and only the store recorded
          # in .modules.yaml is foreign. That is what makes these two
          # genuinely independent checks rather than one in two places — and
          # it is the exact state an operator reaches by following the
          # ownership refusal's chown advice, which repairs permissions and
          # leaves the tree just as foreign to pnpm.
          CASE="7/7 — node_modules built against another user's pnpm store"
          EXPECTED="clean, up-to-date checkout with a RUNNER-owned node_modules (so the ownership check passes) whose .modules.yaml records a root-owned pnpm store; the script must REFUSE with the store message, not the ownership one"
          git -C "$REFSPEC_WORK" checkout --quiet main
          git -C "$REFSPEC_WORK" reset --hard --quiet "$REFSPEC_UPSTREAM_TIP"
          mkdir -p "$REFSPEC_WORK/node_modules"
          printf '{\n  "storeDir": "/root/.local/share/pnpm/store/v3",\n  "virtualStoreDir": "%s/node_modules/.pnpm"\n}\n' \
            "$REFSPEC_WORK" > "$REFSPEC_WORK/node_modules/.modules.yaml"
          run_upgrade
          assert_script_under_test_ran
          [ "$RC" -ne 0 ] || fail "expected a non-zero exit (a refusal), got 0. A modules tree from another user's store makes pnpm either install nothing (and the build fail later with a misleading module-not-found) or wipe the directory unattended."
          grep -q "belongs to a different pnpm store" "$OUT" || fail \
            "exited ${RC}, but not with the foreign-store refusal. Expected output matching \"belongs to a different pnpm store\"."
          if grep -q "build artifacts owned by another user" "$OUT"; then fail \
            "the ARTIFACT-OWNERSHIP refusal fired instead of the store one. node_modules was created owner-owned precisely so it would not — if this fires, the two checks are no longer independent and this case is no longer testing what it claims."; fi
          grep -q "sudo rm -rf" "$OUT" || fail \
            "the refusal fired but did not print a removal command. Chown is NOT the remedy here; the message must tell the operator to remove the modules directories."
          if [ -n "${REFSPEC_WORK:-}" ]; then rm -rf "${REFSPEC_WORK}/node_modules"; fi
          echo "PASS ${CASE}"

          echo ""
          echo "All 7 cases passed against the real upgrade-native.sh."
