name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "20"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openestate/db generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  compose-healthcheck:
    name: docker compose up + healthcheck
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Generate deploy/.env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=$(openssl rand -hex 24)#" .env
          sed -i "s#^JWT_ACCESS_SECRET=.*#JWT_ACCESS_SECRET=$(openssl rand -hex 24)#" .env
          sed -i "s#^JWT_REFRESH_SECRET=.*#JWT_REFRESH_SECRET=$(openssl rand -hex 24)#" .env
          sed -i "s#^PAN_ENCRYPTION_KEY=.*#PAN_ENCRYPTION_KEY=$(openssl rand -hex 24)#" .env

      - name: docker compose up
        working-directory: deploy
        run: docker compose up -d --build

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - name: Dump logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
