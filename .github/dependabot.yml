version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"

  # No "docker" ecosystem entry by design: there are no Dockerfiles and no
  # Compose files anywhere in this repo. Nothing here builds, ships, or runs
  # a container image — production installs natively
  # (deploy/native/install-native.sh, CLAUDE.md rule #1) and the test suite
  # runs against a PostgreSQL and Redis the contributor provides.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
